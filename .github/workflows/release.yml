name: Build and Release

# Publishes a GitHub release on every `v*` tag. The release always includes:
#   - Prebuilt per-(os,arch) daemon tarballs (macOS + Linux, amd64 + arm64)
#   - A universal install.sh (curl|sh one-liner)
#   - The Mac menubar app as a zip (unsigned if no Apple secrets are configured)
# When the Apple Developer ID + notarization + Sparkle secrets are present the
# same release additionally includes a signed+notarized Mac app zip + DMG and a
# Sparkle appcast.xml for auto-update. So a fork with no Apple secrets still
# produces a fully usable release (the Mac app just isn't notarized).
#
# workflow_dispatch runs the whole build without publishing, so forks can smoke
# test the pipeline before tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      APP_NAME: Clipfan
      APP_DIR: apps/mac/Clipfan
      SCHEME: Clipfan
      DERIVED_DATA_PATH: ${{ github.workspace }}/build
      ARTIFACTS_DIR: ${{ github.workspace }}/dist-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Tools
        run: brew install xcodegen

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify SSH Release Gates
        run: bash scripts/test-ssh-release-gates.sh

      # -------------------------------------------------------------------
      # Signing gate — a single source of truth for "should we sign?".
      # Sets steps.gate.outputs.sign = "true" only when every Apple secret is
      # configured AND the caller didn't force-skip via workflow_dispatch.
      # -------------------------------------------------------------------
      - name: Signing gate
        id: gate
        env:
          CERT: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          skip="${{ github.event_name == 'workflow_dispatch' && inputs.skip_signing == true || 'false' }}"
          if [[ "$skip" == "true" ]]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "Signing skipped (workflow_dispatch override)."
            exit 0
          fi
          if [[ -n "$CERT" && -n "$CERT_PW" && -n "$SIGN_ID" && -n "$APPLE_ID" && -n "$APPLE_PW" && -n "$APPLE_TEAM" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets detected — will sign + notarize."
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets not configured — publishing unsigned Mac app."
          fi

      # -------------------------------------------------------------------
      # Daemon payloads (always). Cross-compiles every (os,arch) target and
      # stages them in dist/ with the version stamped from DAEMON_VERSION.
      # -------------------------------------------------------------------
      - name: Build Daemon Payload
        run: |
          set -euo pipefail
          unset CLIPFAN_BUILD_HELPER_ONLY CLIPFAN_BUILD_GO CLIPFAN_TEST_HELPER_ONLY
          bash dist/build-all.sh

      - name: Verify Release Payload
        run: |
          set -euo pipefail
          unset CLIPFAN_BUILD_HELPER_ONLY CLIPFAN_BUILD_GO CLIPFAN_TEST_HELPER_ONLY
          CLIPFAN_VERIFY_ONLY=1 bash dist/build-all.sh

      - name: Package Daemon Tarballs
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR"
          bash dist/make-release-tarballs.sh "$ARTIFACTS_DIR"

      - name: Stage Universal Installer
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR"
          # Bake the releasing repo into the published installer so the
          # `latest/download/install.sh` URL defaults to this repo's releases.
          sed "s|prime-radiant-inc/clipfan|${{ github.repository }}|g" \
              scripts/install.sh > "$ARTIFACTS_DIR/install.sh"
          chmod +x "$ARTIFACTS_DIR/install.sh"

      - name: Extract Release Notes
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR"
          VERSION="${GITHUB_REF_NAME#v}"
          # On workflow_dispatch there's no tag; fall back to DAEMON_VERSION.
          [[ "$VERSION" == "${GITHUB_REF_NAME}" ]] && VERSION="$(tr -d 'v' < DAEMON_VERSION)"
          bash scripts/extract-release-notes.sh "$VERSION" CHANGELOG.md "$ARTIFACTS_DIR/release-notes.md"

      # -------------------------------------------------------------------
      # Mac menubar app build (always, unsigned). CODE_SIGNING_ALLOWED=NO
      # builds the bundle without signing; signing happens in a later step.
      # -------------------------------------------------------------------
      - name: Build Release App
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "${GITHUB_REF_NAME}" ]] && VERSION="$(tr -d 'v' < DAEMON_VERSION)"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          ( cd "$APP_DIR" && xcodegen generate )
          xcodebuild \
            -project "$APP_DIR/Clipfan.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PATH/Contents/Info.plist"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------
      # Mac signing + notarization (only when the gate passed).
      # -------------------------------------------------------------------
      - name: Setup Signing Keychain
        if: steps.gate.outputs.sign == 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          APP_CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          EXISTING_USER_KEYCHAINS=$(security list-keychains -d user | tr -d '"')

          echo "$DEVELOPER_ID_APPLICATION_CERT_BASE64" | base64 --decode > "$APP_CERT_PATH"

          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_USER_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APPLICATION_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" -D "${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}" -t private "$KEYCHAIN_PATH"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Codesign App Bundle
        if: steps.gate.outputs.sign == 'true'
        env:
          DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.build.outputs.app_path }}"
          SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION_SIGNING_IDENTITY"
          security unlock-keychain -p "$RUNNER_TEMP" "$SIGNING_KEYCHAIN_PATH"

          sign_path() {
            local path="$1"
            if [ -e "$path" ]; then
              codesign --keychain "$SIGNING_KEYCHAIN_PATH" --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$path"
            fi
          }

          # Sign inside-out: deepest nested Mach-O first (Sparkle framework + its
          # XPC services / helper apps live under Contents/Frameworks).
          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            while IFS= read -r executable; do sign_path "$executable"; done < <(
              find "$APP_PATH/Contents/Frameworks" -type f -perm -111 -print \
                | awk '{ print length($0) " " $0 }' | sort -rn | cut -d' ' -f2- )
            while IFS= read -r component; do sign_path "$component"; done < <(
              find "$APP_PATH/Contents/Frameworks" \
                \( -name "*.framework" -o -name "*.dylib" -o -name "*.xpc" -o -name "*.bundle" -o -name "*.app" \) -print \
                | awk '{ print length($0) " " $0 }' | sort -rn | cut -d' ' -f2- )
          fi

          # Sign the bundled macOS daemon Mach-O binaries (Resources/dist). The
          # Linux binaries are ELF, not Mach-O, and are left unsigned (notarization
          # ignores non-Mach-O files).
          for bin in \
            clipfan-darwin-amd64 \
            clipfan-darwin-arm64 \
            clipfan-pasteboard-helper-darwin-amd64 \
            clipfan-pasteboard-helper-darwin-arm64; do
            sign_path "$APP_PATH/Contents/Resources/dist/$bin"
          done

          # Main executable, then the outer app.
          if [ -d "$APP_PATH/Contents/MacOS" ]; then
            while IFS= read -r executable; do sign_path "$executable"; done < <(
              find "$APP_PATH/Contents/MacOS" -type f -perm -111 -print \
                | awk '{ print length($0) " " $0 }' | sort -rn | cut -d' ' -f2- )
          fi

          sign_path "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH" || true

      - name: Notarize and Staple
        id: notarize
        if: steps.gate.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.build.outputs.app_path }}"
          NOTARY_ZIP="$RUNNER_TEMP/$APP_NAME-notary.zip"
          NOTARY_SUBMIT_OUTPUT="$RUNNER_TEMP/notary-submit.json"
          NOTARY_LOG_OUTPUT="$RUNNER_TEMP/notary-log.json"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"

          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$NOTARY_SUBMIT_OUTPUT"

          SUBMISSION_ID="$(python3 -c 'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("id",""))' "$NOTARY_SUBMIT_OUTPUT")"
          STATUS="$(python3 -c 'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("status",""))' "$NOTARY_SUBMIT_OUTPUT")"
          echo "Notary submission: $SUBMISSION_ID status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --output-format json > "$NOTARY_LOG_OUTPUT" || true
            [ -s "$NOTARY_LOG_OUTPUT" ] && cat "$NOTARY_LOG_OUTPUT"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------
      # Mac packaging (always). zip is always produced; dmg only when the app
      # was signed + stapled (Gatekeeper would reject an unsigned dmg anyway).
      # -------------------------------------------------------------------
      - name: Package Mac App
        id: pkg
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "${GITHUB_REF_NAME}" ]] && VERSION="$(tr -d 'v' < DAEMON_VERSION)"
          mkdir -p "$ARTIFACTS_DIR"

          APP_ZIP="$ARTIFACTS_DIR/$APP_NAME-$VERSION-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_ZIP"
          echo "app_zip=$APP_ZIP" >> "$GITHUB_OUTPUT"
          echo "Packaged unsigned zip: $APP_ZIP"

          if [[ "${{ steps.notarize.outputs.signed }}" == "true" ]]; then
            APP_DMG="$ARTIFACTS_DIR/$APP_NAME-$VERSION-macOS.dmg"
            hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$APP_DMG"
            echo "app_dmg=$APP_DMG" >> "$GITHUB_OUTPUT"
            echo "Packaged signed dmg: $APP_DMG"
          fi

      # -------------------------------------------------------------------
      # Sparkle appcast (only when signed — auto-update only ships notarized
      # builds, and the appcast needs the Sparkle ED private key to sign).
      # -------------------------------------------------------------------
      - name: Build Sparkle Appcast Tool
        if: steps.gate.outputs.sign == 'true'
        env:
          SPARKLE_REVISION: 6276ba2b404829d139c45ff98427cf90e2efc59b
        run: |
          set -euo pipefail
          SPARKLE_SOURCE="$RUNNER_TEMP/Sparkle"
          SPARKLE_BUILD="$RUNNER_TEMP/sparkle-build"
          git init "$SPARKLE_SOURCE"
          git -C "$SPARKLE_SOURCE" remote add origin https://github.com/sparkle-project/Sparkle.git
          git -C "$SPARKLE_SOURCE" fetch --depth 1 origin "$SPARKLE_REVISION"
          git -C "$SPARKLE_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$SPARKLE_SOURCE" rev-parse HEAD)" = "$SPARKLE_REVISION"
          xcodebuild \
            -project "$SPARKLE_SOURCE/Sparkle.xcodeproj" \
            -scheme generate_appcast \
            -configuration Release \
            -derivedDataPath "$SPARKLE_BUILD" \
            build

      - name: Generate Sparkle Appcast
        if: steps.gate.outputs.sign == 'true'
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_BUILD="$RUNNER_TEMP/sparkle-build"
          GENERATE_APPCAST="$SPARKLE_BUILD/Build/Products/Release/generate_appcast"
          APPCAST_DIR="$RUNNER_TEMP/appcast"
          ED_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p "$APPCAST_DIR"
          cp "${{ steps.pkg.outputs.app_zip }}" "$APPCAST_DIR/"
          ZIP_NAME="$(basename "${{ steps.pkg.outputs.app_zip }}")"
          RELEASE_NOTES="$APPCAST_DIR/${ZIP_NAME%.*}.md"
          bash scripts/extract-release-notes.sh "$VERSION" CHANGELOG.md "$RELEASE_NOTES"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > "$ED_KEY_FILE"

          "$GENERATE_APPCAST" "$APPCAST_DIR" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --embed-release-notes \
            --ed-key-file "$ED_KEY_FILE"

          cp "$APPCAST_DIR/appcast.xml" "$ARTIFACTS_DIR/appcast.xml"

      # -------------------------------------------------------------------
      # Publish. On tag pushes we create/upload the GitHub release. On
      # workflow_dispatch we stop here (no release published) so forks can
      # smoke-test the pipeline without creating a bogus release.
      # -------------------------------------------------------------------
      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=(
            "$ARTIFACTS_DIR/clipfan-darwin-amd64.tar.gz"
            "$ARTIFACTS_DIR/clipfan-darwin-arm64.tar.gz"
            "$ARTIFACTS_DIR/clipfan-linux-amd64.tar.gz"
            "$ARTIFACTS_DIR/clipfan-linux-arm64.tar.gz"
            "$ARTIFACTS_DIR/install.sh"
            "${{ steps.pkg.outputs.app_zip }}"
          )
          [[ -f "${{ steps.pkg.outputs.app_dmg }}" ]] && FILES+=("${{ steps.pkg.outputs.app_dmg }}")
          [[ -f "$ARTIFACTS_DIR/appcast.xml" ]] && FILES+=("$ARTIFACTS_DIR/appcast.xml")

          echo "Release assets:"
          printf '  %s\n' "${FILES[@]}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$ARTIFACTS_DIR/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --notes-file "$ARTIFACTS_DIR/release-notes.md" \
              --title "${GITHUB_REF_NAME}"
          fi

      - name: Workflow dispatch — build only (no release published)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch run: all build steps completed."
          echo "Artifacts staged in $ARTIFACTS_DIR:"
          ls -la "$ARTIFACTS_DIR"
          echo
          echo "No GitHub release created (push a 'v*' tag to publish)."

      - name: Cleanup Keychain
        if: always() && steps.gate.outputs.sign == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
